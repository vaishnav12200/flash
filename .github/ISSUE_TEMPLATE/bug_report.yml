name: Bug report
description: Report a reproducible problem with Flash
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Flash. Remove private shell output, credentials,
        paths, and clipboard contents from logs and screenshots before submitting.

  - type: input
    id: flash-version
    attributes:
      label: Flash version
      description: Run `flash --version` if available, or provide the release/tag/commit used.
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: distribution
    attributes:
      label: Linux distribution and version
      placeholder: Fedora 43, Ubuntu 26.04, Arch Linux, etc.
    validations:
      required: true

  - type: input
    id: compositor
    attributes:
      label: Desktop environment and compositor
      placeholder: GNOME 50 / Mutter, KDE Plasma / KWin, Sway, Hyprland, etc.
    validations:
      required: true

  - type: dropdown
    id: wayland
    attributes:
      label: Native Wayland session
      description: Is Flash running in a native Wayland session rather than X11/XWayland?
      options:
        - Yes
        - No
        - Unsure
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU vendor and model
      placeholder: AMD Radeon RX 7800 XT, Intel Arc, NVIDIA RTX 3050, etc.
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: GPU driver
      placeholder: Mesa 26.1, NVIDIA 590.XX, etc.
    validations:
      required: true

  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: zsh 5.9, bash 5.3, fish 4.x, etc.
    validations:
      required: true

  - type: dropdown
    id: default-config
    attributes:
      label: Reproduces with the default Flash configuration
      options:
        - Yes
        - No
        - Not tested
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of commands and interactions.
      placeholder: |
        1. Start Flash with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include a minimal, redacted `RUST_LOG=flash=debug flash` excerpt when useful.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add a redacted screenshot or configuration excerpt only when it helps reproduce the problem.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private shell history, clipboard contents, and other sensitive information.
          required: true
