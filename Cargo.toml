[package]
name = "flash"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A GPU-first, Wayland-native terminal emulator for Linux"
repository = "https://github.com/vaishnav12200/flash"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "terminal-emulator", "wayland", "wgpu", "linux"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
pollster = "0.3"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.1.14"
vte = "0.15.0"
wgpu = "0.20"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-csd-adwaita", "wayland-dlopen"] }

[[bench]]
name = "terminal_throughput"
harness = false

[profile.release]
strip = "symbols"
